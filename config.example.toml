# DistributionCenter — Solar Network distribution service.
serviceName = "distribution"
version = "dev"

[http]
port = "8080"
# Public base URL used in artifact download_url values; a path prefix is allowed,
# but do not include /api.
baseUrl = ""

[web]
# Directory holding the built console (web/dist). Leave empty to serve the API
# only. The Docker image ships the console at /app/web/dist.
distPath = ""

[grpc]
port = "9090"
# Set true only when the fleet-issued certificate and key are mounted.
useTLS = false
certFile = "Keys/server.crt"
keyFile = "Keys/server.key"

[discovery]
# Blade registration is opt-in for local development.
enabled = false
target = "blade:9090"
registrationToken = ""
service = "distribution"
instanceId = ""
# Empty endpoints default to http://distribution:8080 and distribution:9090.
httpEndpoint = ""
grpcEndpoint = ""
leaseSeconds = 30
weight = 1


[database]
# PostgreSQL DSN is required at startup.
dsn = ""

[auth]
# Stargate owns access-token authentication.
target = "stargate:9090"
useTLS = false
tlsSkipVerify = false

[sphere]
# Sphere owns publisher identity and membership authorization.
target = "sphere:9090"
useTLS = false
tlsSkipVerify = false


[s3]
# Dedicated S3-compatible artifact pool. Objects remain private; published
# artifact responses contain time-limited signed GET URLs.
endpoint = "https://account-id.r2.cloudflarestorage.com"
accessKey = ""
# Secret Access Key paired with accessKey.
secretKey = ""
# Cloudflare R2 uses "auto"; AWS S3 uses the bucket's actual region.
region = "auto"
bucket = ""

[releases]
# Keep this many newest published releases' S3 artifacts per channel.
# Channel settings may use a lower value; zero disables cleanup.
# Expired artifacts remain in release metadata and are reported as expired
# by the release API.
artifactRetention = 3

[eventbus]
# Empty disables optional release events.
url = ""

[analytics]
# Collects pseudonymous update-check telemetry for DAU/MAU and target
# breakdowns. Keep the salt stable across deployments.
enabled = true
salt = ""

[modules]
# Modules are compiled in; this block only decides which of them run.
# Leaving enabled empty uses every module's default (all are enabled).
# enabled = ["app.solian.distribution.sync", "app.solian.sync.github"]
enabled = []
# disabled removes a module and everything that requires it.
# disabled = ["app.solian.sync.gitea"]
disabled = []

# [modules.settings."app.solian.distribution.sync"]
# pollInterval = "10s"

[ports]
# Only needed when several modules provide the same port; the feature module
# wins by default. The sync engine reaches every enabled adapter by module ID,
# so this is not required for release mirroring.
# syncTargets = "app.solian.sync.github"

[sync]
# Seals destination credentials at rest: base64 of a 32-byte key, or 64 hex
# characters. Required while app.solian.distribution.sync is enabled; a key
# change makes existing secrets unreadable, so publishers must re-enter them.
# Generate with: openssl rand -base64 32
encryptionKey = ""
# How often the outbox dispatcher claims due deliveries.
pollInterval = "5s"
# Retry backoff: retryBase * 2^(attempts-1), capped at retryCap.
retryBase = "30s"
retryCap = "1h"
# Attempts before a delivery is marked failed. The retry route re-arms it.
maxAttempts = 8
# Largest artifact uploaded to a destination; zero publishes metadata only.
maxAssetBytes = 2147483648
# Deliveries claimed per dispatcher tick.
batchSize = 16