<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon-outline.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0d16" />
    <meta
      name="description"
      content="Express — the release control plane for Solar Network publishers."
    />
    <title>Express</title>
    <script>
      // Apply the stored (or OS) theme before first paint so a light-theme
      // operator never sees a dark flash while the module bundle loads.
      ;(function () {
        try {
          var stored = localStorage.getItem('express.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme === 'light' ? 'express-light' : 'express'
        } catch (error) {
          /* Leave the default theme in place. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
